{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Exam Guardian{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'evidence/app.css' %}">
  {% block scripts %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <nav class="wrap">
      <a class="brand" href="{% url 'home' %}">Exam Guardian</a>
      <div class="nav-actions">
        {% if user.is_authenticated %}
          <a href="{% url 'review_list' %}">证据工作台</a>
          {% if user.is_superuser %}<a href="{% url 'admin:index' %}">管理设置</a>{% endif %}
          <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="quiet" type="submit">退出 {{ user.username }}</button></form>
        {% else %}
          <a href="{% url 'login' %}">复核员登录</a>
        {% endif %}
      </div>
    </nav>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
